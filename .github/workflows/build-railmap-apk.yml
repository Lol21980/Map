name: Build RailMap Russia APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-railmap-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          APP_DIR=$(find extracted -type f -path '*/android-app/settings.gradle' -print -quit | xargs -r dirname)
          if [ -z "$APP_DIR" ]; then
            echo "Android project not found inside ZIP"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: |
          cd "$APP_DIR"
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RailMap-Russia-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14